[package]
name = "pakuvaraus"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.5"
axum-login = "0.18.0"
axum-messages = "0.8.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
password-auth = "1.0.0"
reqwest = { version = "0.12.24", default-features = false, features = ["multipart", "rustls-tls",] }
tower = "0.5.2"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tower-sessions = "0.14"
thiserror = "2.0.0"
tracing-subscriber = "0.3.20"
tracing = "0.1.41"
askama = "0.14.0"
async-trait = "0.1.91"
validator = { version = "0.21.0", features = ["derive"] }
