[package]
name = "pakuvaraus"
version = "0.1.0"
edition = "2024"
default-run = "pakuvaraus"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
redundant_field_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dependencies]
axum = { version = "0.8.5", features = ["macros"] }
axum-login = "0.18.0"
axum-messages = "0.8.0"
axum-extra = { version = "0.12.6", features = ["attachment"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
password-auth = "1.0.0"
reqwest = { version = "0.12.24", default-features = false, features = ["multipart", "rustls-tls",] }
tower = "0.5.2"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tower-sessions = "0.14"
thiserror = "2.0.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tracing = "0.1.41"
askama = "0.14.0"
async-trait = "0.1.91"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
hetu = "0.9.0"
phonenumber = "0.3.10"
garde = { version = "0.23.0", features = ["email"] }
anyhow = "1.0.104"
base64 = "0.23.1"
rand = "0.10.3"
sha2 = "0.11.1"
utoipa = { version = "6", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3"

[dev-dependencies]
axum-test = "18.2.1" # highest supported by axum 0.8.5
