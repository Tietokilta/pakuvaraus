name: Checks
# Runs `nix flake check` on pull requests. release.yml also calls it, so
# everything that ships from main has passed the same checks first.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.toml', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}

      - name: Run flake checks
        run: nix flake check -L
