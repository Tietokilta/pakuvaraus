name: Release
# Everything that ships from main: run the checks, then build and push the
# Docker image and deploy it to Azure. A published GitHub release does the
# same and also tags the image with the release version.
on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

env:
  docker_image_name: pakuvaraus
  docker_tag_prefix: ghcr.io/tietokilta
  NIX_CACHE_PATHS: |
    /nix/store
    /nix/var/nix/db/db.sqlite
    /nix/var/nix/profiles

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  docker-build-and-push:
    needs: [checks]
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # stops the build-time closure from getting GCed
          extra_nix_config: |
            keep-outputs = true
      - name: Restore Nix store cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NIX_CACHE_PATHS }}
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-
      - name: Build Docker image
        run: nix build .#docker --print-build-logs
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push image
        run: |
          docker load < result

          TAGS=()
          TAGS+=("sha-${{ github.sha }}")

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS+=("latest")
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            TAGS+=("$VERSION")
            MAJOR_MINOR=$(echo "$VERSION" | sed 's/\.[^.]*$//')
            TAGS+=("$MAJOR_MINOR")
          fi

          for TAG in "${TAGS[@]}"; do
            docker tag ${{ env.docker_image_name }}:latest "${{ env.docker_tag_prefix }}/${{ env.docker_image_name }}:$TAG"
            docker push "${{ env.docker_tag_prefix }}/${{ env.docker_image_name }}:$TAG"
          done

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    permissions:
      # Azure login uses OIDC
      id-token: write
      contents: read
    steps:
      - name: Login via Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: tik-pakuvaraus-prod
          images: "${{ env.docker_tag_prefix }}/${{ env.docker_image_name }}:sha-${{ github.sha }}"
