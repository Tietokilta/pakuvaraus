name: Release
# Everything that ships from main: run the checks, then build and push the
# Docker image and deploy it to Azure. A published GitHub release does the
# same and also tags the image with the release version.
on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

env:
  docker_image_name: pakuvaraus
  docker_tag_prefix: ghcr.io/tietokilta
  NIX_CACHE_PATHS: |
    /nix/store
    /nix/var/nix/db/db.sqlite
    /nix/var/nix/profiles

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Publishes the API client to npm when its packed contents differ from the
  # latest published version, as the next patch version. Major and minor come
  # from client/package.json. Uses npm trusted publishing (OIDC), so no npm
  # token is stored in the repository.
  publish-client:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    name: Publish API client to npm
    runs-on: ubuntu-latest
    permissions:
      # npm trusted publishing uses OIDC
      id-token: write
      contents: read
    concurrency:
      group: publish-client
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Restore Nix store cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NIX_CACHE_PATHS }}
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-
      - name: Build the client package
        run: |
          nix build .#api-client --print-build-logs
          cp -rL result client-dist
          chmod -R u+w client-dist
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish if the contents changed
        working-directory: client-dist
        run: |
          name=$(node -p 'require("./package.json").name')
          line=$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")')
          # Latest published patch in this major.minor line, empty if none
          # (an unpublished package prints an `{ "error": ... }` object instead)
          latest=$({ npm view "$name" versions --json 2>/dev/null || true; } | LINE="$line" node -e '
            const input = require("node:fs").readFileSync(0, "utf8").trim() || "[]";
            const prefix = process.env.LINE + ".";
            const patches = [].concat(JSON.parse(input))
              .filter((v) => typeof v === "string" && v.startsWith(prefix))
              .map((v) => Number(v.slice(prefix.length)))
              .filter(Number.isInteger);
            if (patches.length) console.log(Math.max(...patches));
          ')

          if [ -z "$latest" ]; then
            next="$line.0"
          else
            # Compare the packed contents, ignoring the version field
            unpack() {
              mkdir -p "$2"
              tar xzf "$(npm pack "$1" --pack-destination "$2" --silent | tail -1 | sed "s|^|$2/|")" -C "$2"
              node -e '
                const fs = require("node:fs"), f = process.argv[1];
                const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
                delete pkg.version;
                fs.writeFileSync(f, JSON.stringify(pkg, null, 2));
              ' "$2/package/package.json"
            }
            unpack . "$RUNNER_TEMP/new"
            unpack "$name@$line.$latest" "$RUNNER_TEMP/old"
            if diff -r "$RUNNER_TEMP/old/package" "$RUNNER_TEMP/new/package"; then
              echo "Contents match $name@$line.$latest, nothing to publish"
              exit 0
            fi
            next="$line.$((latest + 1))"
          fi

          npm version "$next" --no-git-tag-version --allow-same-version
          npm publish

  docker-build-and-push:
    needs: [checks]
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # stops the build-time closure from getting GCed
          extra_nix_config: |
            keep-outputs = true
      - name: Restore Nix store cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NIX_CACHE_PATHS }}
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-
      - name: Build Docker image
        run: nix build .#docker --print-build-logs
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push image
        run: |
          docker load < result

          TAGS=()
          TAGS+=("sha-${{ github.sha }}")

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS+=("latest")
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            TAGS+=("$VERSION")
            MAJOR_MINOR=$(echo "$VERSION" | sed 's/\.[^.]*$//')
            TAGS+=("$MAJOR_MINOR")
          fi

          for TAG in "${TAGS[@]}"; do
            docker tag ${{ env.docker_image_name }}:latest "${{ env.docker_tag_prefix }}/${{ env.docker_image_name }}:$TAG"
            docker push "${{ env.docker_tag_prefix }}/${{ env.docker_image_name }}:$TAG"
          done

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    permissions:
      # Azure login uses OIDC
      id-token: write
      contents: read
    steps:
      - name: Login via Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: tik-pakuvaraus-prod
          images: "${{ env.docker_tag_prefix }}/${{ env.docker_image_name }}:sha-${{ github.sha }}"
