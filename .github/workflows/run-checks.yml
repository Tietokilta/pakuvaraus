name: Run flake checks
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # stops the build-time closure from getting GCed
          extra_nix_config: |
            keep-outputs = true
      - name: Restore and save /nix/store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.toml', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}
      - name: Run flake checks
        run: |
          nix flake check -L

          # Add GC roots
          nix flake show --json | jq ".checks.\"$(uname -m)-linux\" | keys[]" | \
            xargs -I{} nix build .#checks.$(uname -m)-linux."{}" --out-link "{}"

      - name: Nix GC
        run: |
          nix-collect-garbage
