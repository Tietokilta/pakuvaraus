<html>
  <head>
    <title>Administrator's page</title>
  </head>

  <body>
    <div>
      <p>Logged in as admin: {{username}}</p>
      <a href="/admin/password">Change password</a>
      <a href="/logout">Logout</a>
    </div>

    <div>
      <b>Administrators</b>
      <ul>
        {% for admin in admins %}
        <li>
          <span><strong>{{ admin }}</strong></span> <a href="/admin/{{ admin }}">delete</a>
        </li>
        {% endfor %}
      </ul>

      <a href="/admin/new">Create a new administrator</a>
    </div>

    <div>
      <b>Reservations</b>
      <ul>
        {% for reservation in reservations %}
        <li>
          <span><strong>{{ reservation }}</strong></span>
        </li>
        {% endfor %}
      </ul>
    </div>
  </body>
</html>
