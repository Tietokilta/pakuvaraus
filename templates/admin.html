<html>
  <head>
    <title>Admin page</title>
  </head>

  <body>
    <b>Reservations</b>
    <ul>
      {% for reservation in reservations %}
      <li>
        <span><strong>{{ reservation }}</strong></span>
      </li>
      {% endfor %}
    </ul>

    <b>Administrators</b>
    <ul>
      {% for admin in admins %}
      <li>
        <span><strong>{{ admin }}</strong></span>
      </li>
      {% endfor %}
    </ul>

    <p>Logged in as admin: {{username}}</p>

    <a href="/logout">Logout</a>
  </body>
</html>
